name: CI

# Fast feedback on every PR and on pushes to main: install deps, run the Vitest
# suite, and run the Vite production build. These are the gates the PartyKit
# deploy depends on, so a broken bundle or failing test never ships.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
