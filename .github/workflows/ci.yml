name: CI

# Fast feedback on every PR and on pushes to main: install deps and run the
# Vite production build. The build is the gate the PartyKit deploy depends on,
# so a broken bundle never ships.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
