<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Boards - Whiteboard</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .boards-page {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #f8fafc;
    }

    .boards-header {
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .boards-header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .boards-header h1 svg {
      opacity: 0.8;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      border: none;
    }

    .btn-primary {
      background: #6366f1;
      color: white;
    }

    .btn-primary:hover {
      background: #4f46e5;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .boards-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .boards-stats {
      display: flex;
      gap: 24px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px 24px;
      flex: 1;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: #6366f1;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .boards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .board-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      transition: all 0.2s;
    }

    .board-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .board-icon {
      width: 48px;
      height: 48px;
      background: rgba(99, 102, 241, 0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .board-icon svg {
      color: #6366f1;
    }

    .board-info {
      flex: 1;
      min-width: 0;
    }

    .board-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .board-name .encrypted-badge {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .board-meta {
      font-size: 0.85rem;
      color: #94a3b8;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .board-meta span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .role-badge {
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .role-owner {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }

    .role-collaborator {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
    }

    .role-viewer {
      background: rgba(113, 113, 122, 0.2);
      color: #a1a1aa;
    }

    .board-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .board-actions .btn {
      padding: 8px 16px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 24px;
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      color: #475569;
      margin-bottom: 24px;
    }

    .empty-state h2 {
      font-size: 1.5rem;
      color: #f8fafc;
      margin-bottom: 12px;
    }

    .empty-state p {
      color: #94a3b8;
      margin-bottom: 32px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .clear-all-section {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .clear-all-section p {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .boards-stats {
        flex-direction: column;
        gap: 12px;
      }

      .board-card {
        flex-direction: column;
        align-items: flex-start;
      }

      .board-actions {
        width: 100%;
        justify-content: flex-end;
      }

      .header-actions {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
<body class="boards-page">
  <header class="boards-header">
    <h1>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
      </svg>
      My Boards
    </h1>
    <div class="header-actions">
      <a href="/" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Home
      </a>
      <a href="/" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New Board
      </a>
    </div>
  </header>

  <main class="boards-container">
    <div id="boards-content">
      <!-- Content will be dynamically inserted -->
    </div>
  </main>

  <script type="module">
    import {
      getSavedBoards,
      removeBoard,
      clearAllBoards,
      formatRelativeTime,
      getRoleInfo,
      getBoardCount
    } from '/js/board-history.js';

    function renderBoards() {
      const container = document.getElementById('boards-content');
      const boards = getSavedBoards();

      if (boards.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M3 9h18"/>
              <path d="M9 21V9"/>
            </svg>
            <h2>No boards yet</h2>
            <p>Boards you create or join will appear here. Create your first board to get started!</p>
            <a href="/" class="btn btn-primary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              Create Board
            </a>
          </div>
        `;
        return;
      }

      // Count by role
      const ownerCount = boards.filter(b => b.role === 'owner').length;
      const collabCount = boards.filter(b => b.role === 'collaborator').length;
      const viewerCount = boards.filter(b => b.role === 'viewer').length;

      let html = `
        <div class="boards-stats">
          <div class="stat-card">
            <div class="stat-value">${boards.length}</div>
            <div class="stat-label">Total Boards</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${ownerCount}</div>
            <div class="stat-label">Created by You</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${collabCount + viewerCount}</div>
            <div class="stat-label">Shared with You</div>
          </div>
        </div>

        <div class="boards-list">
      `;

      boards.forEach(board => {
        const roleInfo = getRoleInfo(board.role);
        const roleClass = `role-${board.role}`;

        html += `
          <div class="board-card" data-room-id="${board.roomId}">
            <div class="board-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M3 9h18"/>
                <path d="M9 21V9"/>
              </svg>
            </div>
            <div class="board-info">
              <div class="board-name">
                ${escapeHtml(board.roomName || board.roomId)}
                ${board.isEncrypted ? '<span class="encrypted-badge">Encrypted</span>' : ''}
              </div>
              <div class="board-meta">
                <span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                  </svg>
                  ${formatRelativeTime(board.lastAccessed)}
                </span>
                <span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  ${board.accessCount || 1} visit${(board.accessCount || 1) !== 1 ? 's' : ''}
                </span>
              </div>
            </div>
            <span class="role-badge ${roleClass}">${roleInfo.label}</span>
            <div class="board-actions">
              <button class="btn btn-danger btn-remove" data-room-id="${board.roomId}" title="Remove from history">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
              </button>
              <a href="/room/${board.roomId}${board.isEncrypted ? '' : ''}" class="btn btn-primary">
                Open
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
              </a>
            </div>
          </div>
        `;
      });

      html += `
        </div>

        <div class="clear-all-section">
          <p>Remove all boards from your history. This won't delete the actual boards.</p>
          <button class="btn btn-danger" id="clear-all">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            Clear All History
          </button>
        </div>
      `;

      container.innerHTML = html;

      // Add event listeners
      document.querySelectorAll('.btn-remove').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const roomId = btn.dataset.roomId;
          if (confirm('Remove this board from your history?')) {
            removeBoard(roomId);
            renderBoards();
          }
        });
      });

      document.getElementById('clear-all')?.addEventListener('click', () => {
        if (confirm('Are you sure you want to clear all board history? This cannot be undone.')) {
          clearAllBoards();
          renderBoards();
        }
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initial render
    renderBoards();
  </script>
</body>
</html>
