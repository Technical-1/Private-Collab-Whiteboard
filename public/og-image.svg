<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f0f1a"/>

  <!-- Gradient overlay -->
  <defs>
    <radialGradient id="grad1" cx="50%" cy="0%" r="80%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="grad2" cx="100%" cy="0%" r="60%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  <rect width="1200" height="630" fill="url(#grad2)"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Logo -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#6366f1"/>
    <path d="M20 40L30 30L40 40L50 25L60 35" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="55" r="5" fill="white"/>
  </g>

  <!-- Title -->
  <text x="200" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="white">Whiteboard</text>

  <!-- Tagline -->
  <text x="100" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#a1a1aa">Real-time collaboration with end-to-end encryption</text>

  <!-- Features -->
  <g transform="translate(100, 400)">
    <rect x="0" y="0" width="200" height="50" rx="25" fill="rgba(99, 102, 241, 0.2)"/>
    <text x="100" y="32" font-family="system-ui, sans-serif" font-size="18" fill="#818cf8" text-anchor="middle">No Account Required</text>
  </g>
  <g transform="translate(320, 400)">
    <rect x="0" y="0" width="130" height="50" rx="25" fill="rgba(99, 102, 241, 0.2)"/>
    <text x="65" y="32" font-family="system-ui, sans-serif" font-size="18" fill="#818cf8" text-anchor="middle">P2P Sync</text>
  </g>
  <g transform="translate(470, 400)">
    <rect x="0" y="0" width="160" height="50" rx="25" fill="rgba(99, 102, 241, 0.2)"/>
    <text x="80" y="32" font-family="system-ui, sans-serif" font-size="18" fill="#818cf8" text-anchor="middle">Works Offline</text>
  </g>

  <!-- Decorative elements - cursors -->
  <g transform="translate(850, 180)">
    <path d="M0 0 L0 24 L6 18 L12 30 L16 28 L10 16 L18 16 Z" fill="#22c55e"/>
    <rect x="22" y="14" width="80" height="24" rx="4" fill="#22c55e"/>
    <text x="62" y="31" font-family="system-ui, sans-serif" font-size="14" fill="white" text-anchor="middle">Alex</text>
  </g>

  <g transform="translate(950, 320)">
    <path d="M0 0 L0 24 L6 18 L12 30 L16 28 L10 16 L18 16 Z" fill="#f59e0b"/>
    <rect x="22" y="14" width="80" height="24" rx="4" fill="#f59e0b"/>
    <text x="62" y="31" font-family="system-ui, sans-serif" font-size="14" fill="white" text-anchor="middle">Sarah</text>
  </g>

  <g transform="translate(780, 420)">
    <path d="M0 0 L0 24 L6 18 L12 30 L16 28 L10 16 L18 16 Z" fill="#6366f1"/>
    <rect x="22" y="14" width="80" height="24" rx="4" fill="#6366f1"/>
    <text x="62" y="31" font-family="system-ui, sans-serif" font-size="14" fill="white" text-anchor="middle">You</text>
  </g>

  <!-- Decorative shapes -->
  <rect x="900" y="250" width="120" height="80" rx="4" stroke="#22c55e" stroke-width="3" fill="none" opacity="0.6"/>
  <circle cx="1050" y="380" r="40" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.6"/>
  <line x1="820" y1="500" x2="920" y2="480" stroke="#6366f1" stroke-width="3" opacity="0.6"/>
</svg>
