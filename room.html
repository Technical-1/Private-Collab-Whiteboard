<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Collaborative Whiteboard</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Real-time collaborative whiteboard with end-to-end encryption. Draw, brainstorm, and collaborate with your team.">
  <meta name="keywords" content="whiteboard, collaboration, real-time, drawing, brainstorm, P2P, encrypted">
  <meta name="author" content="Whiteboard">
  <meta name="robots" content="noindex">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Collaborative Whiteboard">
  <meta property="og:description" content="Real-time collaborative whiteboard with end-to-end encryption.">
  <meta property="og:image" content="/og-image.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Collaborative Whiteboard">
  <meta name="twitter:description" content="Real-time collaborative whiteboard with end-to-end encryption.">
  <meta name="twitter:image" content="/og-image.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#6366f1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="room-page">
  <!-- Background -->
  <div class="room-bg"></div>

  <!-- Top Bar -->
  <header class="room-header">
    <div class="header-left">
      <a href="/" class="logo-link">
        <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
          <rect x="2" y="2" width="28" height="28" rx="6" stroke="currentColor" stroke-width="2.5"/>
          <path d="M8 16L12 12L16 16L20 10L24 14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Whiteboard</span>
      </a>
      <span id="connection-status" class="status-connecting">Connecting...</span>
      <div id="encryption-indicator" class="encryption-badge-mini u-hidden">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>Encrypted</span>
      </div>
    </div>
    <div class="header-center">
      <div id="boards" class="board-tabs"></div>
      <button id="new-board" class="add-board-btn" title="New Board">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>
    <div class="header-right">
    </div>
  </header>

  <!-- Floating Toolbar -->
  <div id="floating-toolbar" class="floating-panel toolbar-panel">
    <div class="tool-group">
      <button id="select-tool" class="tool-btn active" title="Select (V)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
        </svg>
      </button>
      <button id="draw-freehand" class="tool-btn" title="Pencil (P)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
        </svg>
      </button>
      <button id="draw-highlight" class="tool-btn" title="Highlighter (H)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 21h6l11-11a2.5 2.5 0 0 0-3.5-3.5L5 17.5 3 21z"/>
          <line x1="14" y1="6" x2="18" y2="10"/>
        </svg>
      </button>
      <button id="draw-line" class="tool-btn" title="Line (L)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="19" x2="19" y2="5"/>
        </svg>
      </button>
      <button id="draw-arrow" class="tool-btn" title="Arrow (A)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="19" x2="19" y2="5"/><polyline points="11 5 19 5 19 13"/>
        </svg>
      </button>
      <button id="draw-rect" class="tool-btn" title="Rectangle (R)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
        </svg>
      </button>
      <button id="draw-diamond" class="tool-btn" title="Diamond (D)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2 22 12 12 22 2 12z"/>
        </svg>
      </button>
      <button id="draw-triangle" class="tool-btn" title="Triangle (Y)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3 22 20 2 20z"/>
        </svg>
      </button>
      <button id="draw-circle" class="tool-btn" title="Circle (C)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
        </svg>
      </button>
      <button id="draw-ellipse" class="tool-btn" title="Ellipse (O)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <ellipse cx="12" cy="12" rx="10" ry="6"/>
        </svg>
      </button>
      <button id="draw-text" class="tool-btn" title="Text (T)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="4 7 4 4 20 4 20 7"/>
          <line x1="9" y1="20" x2="15" y2="20"/>
          <line x1="12" y1="4" x2="12" y2="20"/>
        </svg>
      </button>
      <button id="tool-laser" class="tool-btn" title="Laser pointer (Q)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
      </button>
      <button id="tool-sticky" class="tool-btn" title="Sticky note (S)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16v12l-4 4H4z"/>
          <path d="M20 16h-4v4"/>
        </svg>
      </button>
      <button id="tool-connector" class="tool-btn" title="Connector (G)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/>
          <line x1="7" y1="17" x2="17" y2="7"/>
        </svg>
      </button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="tool-group">
      <button id="eraser-shape" class="tool-btn eraser" title="Eraser (E)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8L14.2 2a2 2 0 0 1 2.8 0L21 5.8a2 2 0 0 1 0 2.8L10 20"/>
        </svg>
      </button>
      <button id="eraser-brush" class="tool-btn eraser" title="Brush Eraser">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/>
          <path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/>
        </svg>
      </button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="tool-group">
      <button id="undo-btn" class="tool-btn" title="Undo (Ctrl+Z)" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 7v6h6"/>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6.3 2.7L3 13"/>
        </svg>
      </button>
      <button id="redo-btn" class="tool-btn" title="Redo (Ctrl+Y)" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 7v6h-6"/>
          <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6.3 2.7L21 13"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Floating Options Panel -->
  <div id="drawing-options" class="floating-panel options-panel">
    <div class="option-section stroke-option">
      <div class="option-label">Stroke</div>
      <div class="stroke-presets">
        <button class="preset-btn" data-width="1">1</button>
        <button class="preset-btn active" data-width="2">2</button>
        <button class="preset-btn" data-width="4">4</button>
        <button class="preset-btn" data-width="8">8</button>
        <button class="preset-btn" data-width="12">12</button>
      </div>
      <input type="range" id="stroke-width" min="1" max="20" value="2">
      <span id="stroke-value" class="option-value">2px</span>
      <div class="stroke-style-group">
        <button class="style-btn active" data-style="solid" title="Solid">—</button>
        <button class="style-btn" data-style="dashed" title="Dashed">- -</button>
        <button class="style-btn" data-style="dotted" title="Dotted">··</button>
      </div>
    </div>
    <div class="option-divider"></div>
    <div class="option-section fill-option">
      <div class="option-label">Fill</div>
      <label class="toggle-switch">
        <input type="checkbox" id="fill-enabled">
        <span class="toggle-slider"></span>
      </label>
      <input type="color" id="fill-color" value="#ffffff" disabled>
    </div>
    <div class="option-section text-options">
      <div class="option-label">Size</div>
      <input type="range" id="font-size" min="12" max="72" value="20">
      <span id="font-size-value" class="option-value">20px</span>
    </div>
    <div class="option-section text-options">
      <div class="option-label">Font</div>
      <select id="font-family">
        <option value="Inter">Inter</option>
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="Courier New">Courier</option>
      </select>
    </div>
    <div class="option-section sticky-options">
      <div class="option-label">Note</div>
      <div class="sticky-palette">
        <button class="sticky-color active" data-color="#fff8b8" title="Yellow"></button>
        <button class="sticky-color" data-color="#ffd1dc" title="Pink"></button>
        <button class="sticky-color" data-color="#c8f7c5" title="Green"></button>
        <button class="sticky-color" data-color="#cfe8ff" title="Blue"></button>
      </div>
    </div>
  </div>

  <!-- Canvas Area -->
  <main id="canvas-area">
    <!-- Live presence (top-right, left of actions bar) -->
    <div id="presence" class="presence-cluster"></div>
    <!-- Glass icon bar (top-right) -->
    <div id="room-actions" class="room-actions floating-panel">
      <button id="invite-btn" class="action-icon" title="Invite people">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </button>
      <label class="action-icon color-swatch" title="Your color">
        <input type="color" id="user-color" value="#6366f1">
      </label>
      <button id="save-image" class="action-icon" title="Save image">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
      <button id="extract-text" class="action-icon" title="Extract text">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="4 7 4 4 20 4 20 7"/>
          <line x1="9" y1="20" x2="15" y2="20"/>
          <line x1="12" y1="4" x2="12" y2="20"/>
        </svg>
      </button>
      <button id="clear-board" class="action-icon" title="Clear board">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
      </button>
      <button id="add-encryption" class="action-icon" title="Add encryption">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </button>
      <button id="change-password" class="action-icon u-hidden" title="Change password">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </button>
    </div>
    <div id="canvas-container">
      <!-- Loading Overlay -->
      <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <span class="loading-text">Connecting to room...</span>
      </div>
      <!-- Empty State (shown when board is empty) -->
      <div id="empty-state" class="empty-state u-hidden">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
        </svg>
        <p>Start drawing or select a tool from the toolbar</p>
        <span class="empty-hint">Press <kbd>?</kbd> for keyboard shortcuts</span>
      </div>
      <canvas id="board"></canvas>
      <div id="cursors"></div>
      <div id="shape-controls"></div>
    </div>

    <!-- Zoom Controls -->
    <div id="zoom-controls" class="floating-panel zoom-panel">
      <button id="zoom-out" class="zoom-btn" title="Zoom Out (-)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
      <button id="zoom-level" class="zoom-level-btn" title="Reset to 100%">100%</button>
      <button id="zoom-in" class="zoom-btn" title="Zoom In (+)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
          <line x1="11" y1="8" x2="11" y2="14"/>
        </svg>
      </button>
      <div class="zoom-divider"></div>
      <button id="zoom-fit" class="zoom-btn" title="Fit All">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
        </svg>
      </button>
    </div>
  </main>

  <!-- Read-only mode banner -->
  <div class="read-only-banner">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
    <span>View Only Mode</span>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
